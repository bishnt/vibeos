name: build-web
on:
  push:
    paths: ['web/**', 'config/**', '.github/workflows/build-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}-web:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          set -o pipefail
          docker build -f web/Dockerfile -t "$IMAGE" --progress=plain . 2>&1 | tee build.log
      - name: Check image size
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "::notice title=Image size::$((size/1000000)) MB uncompressed"
          [ "$size" -lt 7000000000 ] || { echo "::error title=Image too large for Fly (8 GiB limit)::$((size/1000000)) MB"; exit 1; }
      - name: Report build errors
        if: failure()
        run: |
          echo "::error title=Matching lines::$(grep -E 'E: |Unable to locate|no installation candidate|ERROR|not found|No space' build.log | tail -15 | tr '\n' ' ' | cut -c1-3000)"
          echo "::error title=Log tail::$(tail -25 build.log | tr '\n' ' ' | cut -c1-3000)"
      - name: Push image
        run: docker push "$IMAGE"
