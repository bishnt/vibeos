# Deploy: flyctl deploy --remote-only   (app name must be globally unique)
app = "bishnt-vibeos"
primary_region = "sin"

[build]
  dockerfile = "web/Dockerfile"

[http_service]
  internal_port = 6080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
