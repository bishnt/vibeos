name: build-web
on:
  push:
    paths: ['web/**', 'config/includes.chroot/**', 'fly.toml', '.github/workflows/build-web.yml']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}-web:latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          set -o pipefail
          docker build -f web/Dockerfile -t "$IMAGE" --progress=plain . 2>&1 | tee build.log
      - name: Check image size
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "::notice title=Image size::$((size/1000000)) MB uncompressed"
          [ "$size" -lt 7000000000 ] || { echo "::error title=Image too large for Fly (8 GiB limit)::$((size/1000000)) MB"; exit 1; }
      - name: Smoke test
        run: |
          docker run -d --shm-size=512m --name vibeos-lite -e VNC_PASSWORD=testpass1 -p 6080:6080 "$IMAGE"
          sleep 25
          curl -sf localhost:6080/ | grep -q "Launch desktop"
          curl -sf localhost:6080/ | grep -q "Icarus Verilog"
          curl -sf localhost:6080/tools.html | grep -q "Ohm"
          curl -sf localhost:6080/started.txt | grep -Eq '^[0-9]+$'
          docker exec vibeos-lite pgrep -x Xtigervnc
          docker exec vibeos-lite pgrep -x xfce4-panel
          docker exec vibeos-lite pgrep -x xfdesktop
          docker exec vibeos-lite sh -c 'for t in ngspice iverilog gtkwave avr-gcc gnuplot geany; do command -v $t || exit 1; done'
          docker exec vibeos-lite python3 -c "import numpy, scipy, matplotlib, sympy, serial"
          echo "::notice title=Smoke test::landing page, calculators, desktop and tools all work"
      - name: Screenshot of the desktop
        continue-on-error: true
        run: |
          docker exec -d -u vibe -e DISPLAY=:1 -e HOME=/home/vibe vibeos-lite sh -c 'xfce4-terminal --geometry=100x26 & firefox-esr http://localhost:6080/tools.html & wait'
          docker exec vibeos-lite sh -c 'apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends scrot >/dev/null'
          sleep 25
          docker exec vibeos-lite pgrep -a firefox | head -2 || true
          docker exec -u vibe -e DISPLAY=:1 vibeos-lite scrot -o /tmp/desktop.png
          mkdir -p /tmp/shots && docker cp vibeos-lite:/tmp/desktop.png /tmp/shots/desktop.png
          cd /tmp/shots && git init -q -b screenshots && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "desktop screenshot" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
      - name: Report failure details
        if: failure()
        run: |
          echo "::error title=Matching lines::$(grep -E 'E: |Unable to locate|no installation candidate|ERROR|not found|No space' build.log | tail -15 | tr '\n' ' ' | cut -c1-2500)"
          echo "::error title=Container log::$(docker logs vibeos-lite 2>&1 | tail -30 | tr '\n' ' ' | cut -c1-2500)"
      - name: Push image
        run: docker push "$IMAGE"
